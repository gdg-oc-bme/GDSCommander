# Start or update the bot: docker compose up -d --build
# Fixed project name so the bot-data volume (the database) is found again
# whatever folder the repo is cloned into
name: gdscommander

services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
